<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITULO}}</title>
  <style>
    /* ═══════════════════════════════════════════
       TEMA B-ISAF — SLIDES PREMIUM
       ═══════════════════════════════════════════ */

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    :root {
      --bg-dark: #0f172a;
      --slide-dark-bg: linear-gradient(135deg, #1e1b4b 0%, #050816 50%, #0f172a 100%);
      --slide-light-bg: #ffffff;
      --text-dark: #1e293b;
      --text-light: #e2e8f0;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #4f46e5;
      --gradient-text: linear-gradient(135deg, #818cf8, #6366f1);
      --border-light: rgba(0, 0, 0, 0.05);
      --border-dark: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      place-items: center;
      padding: 40px 20px;
    }

    /* ── Slide Container ── */
    .slide {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide > * { position: relative; z-index: 1; }

    /* ── Slide Escuro (capas, secções) ── */
    .slide.dark {
      background: var(--slide-dark-bg);
      color: var(--text-light);
    }

    .slide.dark::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      z-index: 0;
    }

    /* ── Slide Claro (conteúdo) ── */
    .slide.light {
      background: var(--slide-light-bg);
      color: var(--text-dark);
    }

    .slide.light::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.04) 0%, transparent 70%);
      z-index: 0;
    }

    /* ── Tipografia ── */
    .slide h1 {
      font-size: 3em;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .slide.dark h1 {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .slide.light h1 { color: var(--text-dark); }

    .slide h2 {
      font-size: 2em;
      font-weight: 700;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary);
      padding-left: 16px;
    }

    .slide.dark h2 { color: var(--primary-light); }
    .slide.light h2 { color: var(--accent); }

    .slide h3 {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .slide p, .slide li {
      font-size: 1.15em;
      line-height: 1.7;
      font-weight: 300;
    }

    .slide ul, .slide ol { padding-left: 24px; }
    .slide li { margin-bottom: 8px; }
    .slide strong { font-weight: 600; }

    /* ── Tabelas ── */
    .slide table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95em;
      border-radius: 12px;
      overflow: hidden;
    }

    .slide.dark table { background: rgba(255, 255, 255, 0.03); }
    .slide.light table { background: #f8fafc; }

    .slide th {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 14px 20px;
      font-weight: 600;
      text-align: left;
    }

    .slide td { padding: 12px 20px; }

    .slide.dark td { border-bottom: 1px solid var(--border-dark); }
    .slide.light td { border-bottom: 1px solid var(--border-light); }

    /* ── Citações ── */
    .slide blockquote {
      border-left: 4px solid var(--primary-light);
      padding: 16px 24px;
      margin: 20px 0;
      font-style: normal;
      border-radius: 0 8px 8px 0;
    }

    .slide.dark blockquote {
      background: rgba(99, 102, 241, 0.1);
      color: #c7d2fe;
    }

    .slide.light blockquote {
      background: #eef2ff;
      color: var(--accent);
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 500;
    }

    .slide.dark .badge { background: rgba(99, 102, 241, 0.15); color: var(--primary-light); }
    .slide.light .badge { background: #eef2ff; color: var(--accent); }

    /* ── Gradiente numérico ── */
    .highlight-number {
      font-size: 4em;
      font-weight: 900;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    /* ── Layout de duas colunas ── */
    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    /* ── Responsivo ── */
    @media (max-width: 768px) {
      .slide {
        padding: 30px 40px;
        border-radius: 16px;
      }
      .slide h1 { font-size: 2em; }
      .slide h2 { font-size: 1.4em; }
      .slide p, .slide li { font-size: 1em; }
      .two-columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- {{SLIDES}} — substituído pelo conteúdo da aula -->
  {{SLIDES}}
</body>
</html>
